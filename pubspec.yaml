version: 1.0.0
homepage: https://github.com/flutter-visual-test-runner/flutter_visual_test_runner
repository: https://github.com/flutter-visual-test-runner/flutter_visual_test_runner
issue_tracker: https://github.com/flutter-visual-test-runner/flutter_visual_test_runner/issues

topics:
